<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#090b16" />
  <meta name="description" content="王さまから遊び用AIプロンプトを受け取り、好きなAIへ旅立つ8bit RPG風ミニゲーム。" />
  <meta property="og:title" content="AI QUEST - 王さまの遊びプロンプト" />
  <meta property="og:description" content="王さまから遊び用AIプロンプトを受け取り、好きなAIへ旅立つ8bit RPG風ミニゲーム。" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://stellates.github.io/ai-quest/" />
  <meta property="og:image" content="https://stellates.github.io/ai-quest/assets/images/og/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="AI QUEST - 王さまの遊びプロンプト" />
  <meta name="twitter:description" content="王さまから遊び用AIプロンプトを受け取り、好きなAIへ旅立つ8bit RPG風ミニゲーム。" />
  <meta name="twitter:image" content="https://stellates.github.io/ai-quest/assets/images/og/og-image.png" />
  <title>AI QUEST - 王さまの遊びプロンプト</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="game" class="game-shell" aria-live="polite">
    <button id="soundBtn" class="sound-btn" aria-label="音のオンオフ" aria-pressed="true">♪ ON</button>

    <section id="screen-title" class="screen active">
      <div class="sky-stars" aria-hidden="true"></div>
      <div class="mountains" aria-hidden="true"></div>
      <div class="castle-silhouette" aria-hidden="true">
        <span class="tower t1"></span><span class="tower t2"></span><span class="tower t3"></span>
        <span class="keep"></span><span class="door"></span>
      </div>
      <div class="title-card pixel-panel">
        <img class="title-logo" src="assets/images/ui/title-logo.svg" alt="AI QUEST — 王さまの遊びプロンプトRPG" />
        <p class="eyebrow">8-BIT AI ADVENTURE</p>
        <p class="subtitle">王さまの遊びプロンプト</p>
        <p class="small-copy">そなたを ちょっとしたAIの冒険へ 送り出そう。</p>
        <button id="startBtn" class="pixel-btn main-action">▶ 冒険をはじめる</button>
        <p class="tiny">※ 音は最初の操作後に鳴ります</p>
      </div>
    </section>

    <section id="screen-hero" class="screen">
      <div class="scene castle-courtyard">
        <div class="scene-title">勇者をえらべ</div>
        <div class="hero-grid">
          <button class="hero-card" data-gender="male" aria-label="男勇者を選ぶ" aria-pressed="false">
            <span class="hero-select-corner" aria-hidden="true">✦</span>
            <img class="character-art hero-art" src="assets/images/characters/hero-male.svg" alt="" />
            <strong>男勇者</strong><small>剣と知恵で進む者</small>
          </button>
          <button class="hero-card" data-gender="female" aria-label="女勇者を選ぶ" aria-pressed="false">
            <span class="hero-select-corner" aria-hidden="true">✦</span>
            <img class="character-art hero-art" src="assets/images/characters/hero-female.svg" alt="" />
            <strong>女勇者</strong><small>魔法と知恵で進む者</small>
          </button>
        </div>
      </div>
    </section>

    <section id="screen-name" class="screen">
      <div class="name-room">
        <div class="name-room-ornament" aria-hidden="true"><span>✦</span><i></i><span>✦</span></div>
        <div class="pixel-panel compact">
          <p class="window-label">勇者登録所</p>
          <p>冒険の書に 名をきざむのじゃ。</p>
          <input id="nameInput" maxlength="12" autocomplete="off" placeholder="なまえ" aria-label="勇者の名前" />
          <button id="nameBtn" class="pixel-btn">けってい</button>
        </div>
      </div>
    </section>

    <section id="screen-service" class="screen">
      <div class="service-room">
        <div class="scene-title">AIの相棒をえらべ</div>
        <div class="service-grid">
          <button class="service-card" data-service="chatgpt" aria-label="ChatGPTを選ぶ" aria-pressed="false">
            <strong>ChatGPT</strong><small>対話の相棒</small>
          </button>
          <button class="service-card" data-service="gemini" aria-label="Geminiを選ぶ" aria-pressed="false">
            <strong>Gemini</strong><small>ひらめきの相棒</small>
          </button>
          <button class="service-card" data-service="copilot" aria-label="Copilotを選ぶ" aria-pressed="false">
            <strong>Copilot</strong><small>仕事の相棒</small>
          </button>
          <button class="service-card" data-service="claude" aria-label="Claudeを選ぶ" aria-pressed="false">
            <strong>Claude</strong><small>文章づくりの相棒</small>
          </button>
          <button class="service-card" data-service="grok" aria-label="Grokを選ぶ" aria-pressed="false">
            <strong>Grok</strong><small>アイデアの相棒</small>
          </button>
        </div>
      </div>
    </section>

    <section id="screen-dialog" class="screen dialog-screen">
      <div class="castle-room">
        <div class="torch torch-left" aria-hidden="true"><i></i></div>
        <div class="torch torch-right" aria-hidden="true"><i></i></div>
        <div class="wall-banner left">AI</div><div class="wall-banner right">QUEST</div>
        <div class="throne-area">
          <img class="throne" src="assets/images/objects/throne.svg" alt="" />
          <img class="king character-art" src="assets/images/characters/king.svg" alt="王さま" />
        </div>
        <div id="heroSprite" class="dialog-hero"></div>
        <div class="floor-shadow"></div>
      </div>
      <div class="dialog-box pixel-panel">
        <div class="dialog-topline"><div id="speaker" class="speaker">王さま</div></div>
        <p id="dialogText"></p>
        <div id="choices" class="choice-row"></div>
      </div>
    </section>

    <section id="screen-result" class="screen">
      <div class="result-wrap">
        <div id="resultBurst" class="result-burst" aria-hidden="true"></div>
        <div class="pixel-panel result-card">
          <p class="result-kicker">王さまの遊びのお題</p>
          <p class="result-service-label">旅立ち先：<strong id="resultService">ChatGPT</strong></p>
          <div id="heroType" class="hero-type">遊びのプロンプト</div>
          <p class="loot-text">▼ 実行プロンプトを てにいれた！</p>
          <h2 id="resultName">方向感覚の迷宮</h2>
          <p id="resultTagline" class="result-tagline"></p>
          <div class="quest-prompt-wrap">
            <label for="questPrompt">王さまからの依頼</label>
            <textarea id="questPrompt" rows="3" readonly aria-label="王さまの遊びプロンプト"></textarea>
          </div>
          <div class="result-actions">
            <button id="copyPromptBtn" class="pixel-btn">依頼文をコピー</button>
          </div>
          <p id="promptStatus" class="prompt-status" aria-live="polite"></p>
          <div class="gate" aria-hidden="true"><img class="gate-glow" src="assets/images/objects/gate-glow.svg" alt="" /><img class="gate-image" src="assets/images/objects/gate.svg" alt="" /></div>
          <div class="result-bottom-actions">
            <button id="warpBtn" class="pixel-btn main-action">AIへ行く ↗</button>
            <button id="drawAgainBtn" class="pixel-btn secondary">もう一度引く</button>
            <button id="changeServiceBtn" class="pixel-btn secondary">AIを変更</button>
            <button id="restartBtn" class="pixel-btn secondary">最初から</button>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
